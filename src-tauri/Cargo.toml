[package]
name = "distribution-os"
version = "0.1.0"
description = "Distribution OS — local-first content & distribution command center"
authors = ["Distribution OS"]
edition = "2021"

# Tauri v2: the app logic lives in a lib so it can be reused on mobile targets.
[lib]
name = "distribution_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite with FTS5 enabled (used by the KB search).
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
tauri-plugin-notification = "2.3.3"
# Blocking HTTPS for the OAuth token exchange. Rustls avoids linking a
# platform TLS stack, and `json` gives us the response parsing for free.
ureq = { version = "2", features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
