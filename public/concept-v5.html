<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Distribution OS — v5</title>

<!--
  ════════════════════════════════════════════════════════════════════════════
  DISTRIBUTION OS · v5 — the merge.

  Assembled from the parts of the lab that survived judgement:

    from F1 CLASSIC   Assets (one store, used everywhere) · Library · Calendar
    from F2 STUDIO    Gates, promoted into real Analytics · the Long room
    from F3 CHANNELS  the channel Wall · One channel · the week board

  SPINE. Places, but only six of them, and each place answers one question.
    Plan       when does it go out            kanban ⇄ calendar, one toggle
    Library    what already went out
    Articles   the long-form room             list of cards → one long room
    Assets     what everything is made of
    Analytics  what any of it earned          wall of channels → one channel

  THE CHANNEL IS THE COLOUR. Every account carries one tint, derived from its
  platform and shaded per handle. That tint is the only way a calendar chip, a
  kanban card, a lane and an analytics tile ever say "this is @validate.app"
  without spelling it out. Eleven accounts, eleven tints, one legend.

  MATERIAL. T6 Classical, dialled down. Garamond for reading matter, Public
  Sans for chrome, Azeret for numbers, rubric red used as a mark and never as a
  fill. Paper is #f7f6f3. Charts are smoothed monotone cubics on hairline
  grids — macOS soft, not dashboard-sharp.

  This is a static design target. Nothing here is wired.
  ════════════════════════════════════════════════════════════════════════════
-->

<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1 · TOKENS
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  --paper:    #f7f6f3;
  --card:     #ffffff;
  --side:     #f2f1ec;
  --sunk:     #eeece6;

  --ink:      #23252b;
  --ink-2:    color-mix(in srgb, var(--ink) 64%, var(--paper));
  --ink-3:    color-mix(in srgb, var(--ink) 44%, var(--paper));
  --ink-4:    color-mix(in srgb, var(--ink) 27%, var(--paper));
  --rule:     color-mix(in srgb, var(--ink) 9%, transparent);
  --rule-2:   color-mix(in srgb, var(--ink) 16%, transparent);

  --rubric:   #a3271e;
  --good:     #2e7d63;
  --warn:     #b4571f;

  --ui:      "EB Garamond", Georgia, serif;
  --sans:    "Public Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:    "Azeret Mono", ui-monospace, SFMono-Regular, monospace;

  --f-2: 10px; --f-1: 11.5px; --f0: 13px; --f1: 16px; --f2: 20.5px; --f3: 26px; --f4: 33px;

  --r:   7px;
  --r-l: 11px;
  --lift: 0 1px 1.5px rgb(35 37 43 / .05), 0 4px 14px -6px rgb(35 37 43 / .13);
  --pop:  0 2px 5px rgb(35 37 43 / .07), 0 22px 46px -16px rgb(35 37 43 / .30);

  --side-w: 232px;
  --bar-h:  54px;
  --t: .19s cubic-bezier(.32,.72,.28,1);
}

/* channel tints — platform base, shaded per handle */
:root {
  --p-x:         #33363d;
  --p-instagram: #a8577a;
  --p-medium:    #2f7355;
  --p-linkedin:  #35618c;
  --p-threads:   #6d4f96;
  --p-reddit:    #bf5327;
}

* { margin: 0; padding: 0; box-sizing: border-box; font: inherit; color: inherit; background: none; border: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; text-align: left; }
svg { display: block; flex: 0 0 auto; }
::selection { background: color-mix(in srgb, var(--rubric) 22%, transparent); }

html, body { height: 100%; }
body {
  font-family: var(--ui);
  font-size: var(--f0);
  font-variant-numeric: oldstyle-nums proportional-nums;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ═══════════════════════════════════════════════════════════════════════════
   2 · TYPE VOCABULARY
   ═══════════════════════════════════════════════════════════════════════════ */
.sans, .btn, .seg button, .chip, .fchip, .k, .sechead, .lbl, .tag, .col-h, .th,
.pend, .hchip, .ahead, .lanelab .ah, .kbd, .navrow, .stat-k, .legend, .dhead b { font-family: var(--sans); }

.meta, .num, .time, .mono, .stat-v, .tnum, .evt, .cd { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.meta { font-size: var(--f-1); color: var(--ink-3); letter-spacing: -.01em; }

.sechead {
  font-size: var(--f-2); letter-spacing: .13em; text-transform: uppercase;
  font-weight: 600; color: var(--ink-4);
  display: flex; align-items: center; gap: 8px;
}
.sechead .meta { text-transform: none; letter-spacing: 0; font-size: var(--f-2); }
.sechead .ln { flex: 1; height: 1px; background: var(--rule); }

h1 { font-size: var(--f2); font-weight: 500; letter-spacing: -.004em; line-height: 1.12; }
h2 { font-size: var(--f1); font-weight: 500; }
.ttl .sub { font-family: var(--sans); font-size: var(--f-1); color: var(--ink-3); margin-top: 2px; }
.grow { flex: 1 1 auto; min-width: 0; }
.k {
  font-size: var(--f-2); letter-spacing: .05em; color: var(--ink-4);
  text-transform: uppercase; font-weight: 600; flex: 0 0 auto;
}

/* ═══════════════════════════════════════════════════════════════════════════
   3 · CONTROLS
   ═══════════════════════════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  padding: 6px 13px; border-radius: var(--r); font-size: var(--f-1); font-weight: 600;
  box-shadow: inset 0 0 0 1px var(--rule-2); color: var(--ink-2);
  transition: background var(--t), box-shadow var(--t);
}
.btn:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); color: var(--ink); }
.btn.pri { background: var(--ink); color: var(--paper); box-shadow: none; }
.btn.pri:hover { background: color-mix(in srgb, var(--ink) 86%, #000); color: var(--paper); }
.btn.ghost { box-shadow: none; color: var(--ink-3); }
.btn kbd { font-family: var(--mono); font-size: var(--f-2); opacity: .6; margin-left: 3px; }

.icobtn {
  width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto;
  border-radius: var(--r); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule-2);
  transition: background var(--t);
}
.icobtn:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.icobtn.acc { background: var(--ink); color: var(--paper); box-shadow: none; }
.icobtn.bare { box-shadow: none; }

.seg {
  display: inline-flex; flex: 0 0 auto; padding: 2px; gap: 2px;
  border-radius: calc(var(--r) + 2px); background: color-mix(in srgb, var(--ink) 5%, transparent);
  box-shadow: inset 0 0 0 1px var(--rule);
}
.seg button {
  padding: 4px 11px; border-radius: var(--r); font-size: var(--f-1); font-weight: 600;
  color: var(--ink-3); transition: background var(--t), color var(--t), box-shadow var(--t);
  display: inline-flex; align-items: center; gap: 5px;
}
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--lift); }

.chip {
  display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
  padding: 3px 9px; border-radius: 999px; font-size: var(--f-1);
  box-shadow: inset 0 0 0 1px var(--rule-2); color: var(--ink-2);
}
.chip.on { box-shadow: inset 0 0 0 1px var(--ink-3); color: var(--ink); }

.fchip {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  padding: 4px 11px; border-radius: 999px; font-size: var(--f-1); font-weight: 500;
  color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule);
  transition: background var(--t), box-shadow var(--t), color var(--t);
}
.fchip:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.fchip .c { font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.fchip.on { background: var(--ink); color: var(--paper); box-shadow: none; }
.fchip.on .c { color: color-mix(in srgb, var(--paper) 66%, var(--ink)); }

.field {
  display: flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: var(--r);
  color: var(--ink-3); background: color-mix(in srgb, var(--ink) 4%, transparent);
  box-shadow: inset 0 0 0 1px var(--rule);
}
.field input { flex: 1; min-width: 0; font-size: var(--f0); color: var(--ink); outline: 0; }
.field input::placeholder { color: var(--ink-4); }
.field kbd { font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.field.sm { padding: 4px 8px; font-size: var(--f-1); }
.field.sm input { font-size: var(--f-1); }

.tag {
  display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto;
  padding: 2px 8px; border-radius: 4px; font-size: var(--f-2); font-weight: 700;
  letter-spacing: .07em; text-transform: uppercase;
}
.tag.draft     { color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--rule-2); }
.tag.scheduled { color: var(--rubric); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--rubric) 34%, transparent); }
.tag.published { color: var(--good); background: color-mix(in srgb, var(--good) 11%, transparent); }
.tag.idea      { color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 30%, transparent); }

.hchip {
  display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto;
  padding: 2px 7px; border-radius: 999px; font-size: var(--f-2); font-weight: 600;
  font-family: var(--sans);
}
.hchip.ok   { color: var(--good);   background: color-mix(in srgb, var(--good) 11%, transparent); }
.hchip.warn { color: var(--warn);   background: color-mix(in srgb, var(--warn) 12%, transparent); }
.hchip.bad  { color: var(--rubric); background: color-mix(in srgb, var(--rubric) 11%, transparent); }
.hchip.off  { color: var(--ink-4);  background: color-mix(in srgb, var(--ink) 6%, transparent); }

.delta { font-family: var(--mono); font-size: var(--f-2); display: inline-flex; align-items: center; gap: 2px; }
.delta.up   { color: var(--good); }
.delta.dn   { color: var(--rubric); }
.delta.flat { color: var(--ink-4); }

/* avatars & platform glyphs */
.av {
  position: relative; width: 20px; height: 20px; flex: 0 0 auto;
  display: grid; place-items: center; border-radius: 50%;
  font-family: var(--ui); font-size: var(--f-1); font-weight: 600;
  background: var(--ch, var(--ink-4)); color: #fff;
}
.av.lg { width: 40px; height: 40px; font-size: var(--f1); }
.av.sm { width: 15px; height: 15px; font-size: var(--f-2); }
.av .dot { position: absolute; right: -1px; bottom: -1px; width: 7px; height: 7px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 1.6px var(--card); }
.av .dot[data-on="false"] { background: var(--rubric); }
.pgl { color: var(--ink-3); display: flex; flex: 0 0 auto; }
.pgl.tint { color: var(--ch); }

/* ═══════════════════════════════════════════════════════════════════════════
   4 · WINDOW SHELL
   ═══════════════════════════════════════════════════════════════════════════ */
.app { height: 100%; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); }

.side {
  background: var(--side); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column; min-height: 0; padding-bottom: 0;
}
.lights { display: flex; gap: 8px; padding: 17px 16px 13px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; }
.lights i:nth-child(3) { background: #28c840; }

.proj {
  display: flex; align-items: center; gap: 9px; margin: 0 10px 10px; padding: 7px 8px;
  border-radius: var(--r); transition: background var(--t);
}
.proj:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.pmark {
  width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center;
  border-radius: 6px; background: var(--ink); color: var(--paper);
  font-family: var(--ui); font-size: var(--f0); font-weight: 600;
}
.pname { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.pname b { font-family: var(--sans); font-size: var(--f-1); font-weight: 600; }
.pname em { font-style: normal; font-size: var(--f-2); font-family: var(--sans); color: var(--ink-3); }
.proj svg { margin-left: auto; color: var(--ink-4); }

.side .field { margin: 0 10px 12px; }

.nav { padding: 0 8px; display: flex; flex-direction: column; gap: 1px; }
.navrow {
  display: flex; align-items: center; gap: 9px; padding: 6px 9px; border-radius: var(--r);
  font-size: var(--f0); font-weight: 500; color: var(--ink-2);
  transition: background var(--t), color var(--t);
}
.navrow svg { color: var(--ink-4); }
.navrow .c { margin-left: auto; font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.navrow:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink); }
.navrow.on { background: var(--card); color: var(--ink); box-shadow: var(--lift); font-weight: 600; }
.navrow.on svg { color: var(--rubric); }

.railsec { padding: 18px 17px 7px; }
.accts { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 8px 10px; }
.agroup { margin-bottom: 10px; }
.ahead {
  display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px;
  font-size: var(--f-2); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-4); font-weight: 600;
}
.ahead .ln { flex: 1; height: 1px; background: var(--rule); }
.arow {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 9px;
  border-radius: var(--r); font-size: var(--f-1); color: var(--ink-2);
  transition: background var(--t);
}
.arow:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.arow .ah { font-family: var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .pend { margin-left: auto; font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.arow .pend.bad { color: var(--rubric); }
.addacct {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 9px;
  border-radius: var(--r); font-size: var(--f-1); color: var(--ink-4); font-family: var(--sans);
}
.addacct:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--ink-2); }

.nextdue {
  display: flex; align-items: center; gap: 8px; padding: 11px 16px;
  border-top: 1px solid var(--rule); font-size: var(--f-1); color: var(--ink-2); font-family: var(--sans);
}
.pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: 0 0 auto;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--good) 55%, transparent);
  animation: pulse 2.6s ease-out infinite;
}
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }

/* ── main region ────────────────────────────────────────────────────────── */
.main { min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--paper); }

.bar {
  height: var(--bar-h); flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px; padding: 0 18px;
  border-bottom: 1px solid var(--rule); background: var(--paper);
}
.bar h1 { font-size: var(--f2); }
.scroll { overflow: auto; min-height: 0; }
.pad { padding: 20px 22px 40px; }

/* ═══════════════════════════════════════════════════════════════════════════
   5 · PLAN — kanban
   ═══════════════════════════════════════════════════════════════════════════ */
.filters { display: flex; align-items: center; gap: 7px; padding: 11px 18px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.filters::-webkit-scrollbar { display: none; }
.fdiv { width: 1px; height: 18px; flex: 0 0 auto; margin: 0 3px; background: var(--rule-2); }
.swatch { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; background: var(--ch); }

.kan { display: flex; gap: 14px; padding: 18px; min-height: 100%; align-items: flex-start; }
.kcol {
  flex: 1 1 0; min-width: 218px; display: flex; flex-direction: column; gap: 9px;
  background: color-mix(in srgb, var(--ink) 3%, transparent);
  border-radius: var(--r-l); padding: 11px 10px 12px;
}
.kcolh { display: flex; align-items: baseline; gap: 7px; padding: 1px 3px 2px; }
.kcolh b { font-family: var(--sans); font-size: var(--f-1); font-weight: 700; letter-spacing: .02em; }
.kcolh .c { font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.kcolh em { font-style: normal; font-family: var(--sans); font-size: var(--f-2); color: var(--ink-4); margin-left: auto; }

.kcard {
  display: block; width: 100%; background: var(--card); border-radius: var(--r);
  box-shadow: var(--lift); padding: 10px 11px 9px; position: relative; overflow: hidden;
  transition: box-shadow var(--t), translate var(--t);
}
.kcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--ch, var(--rule-2)); }
.kcard:hover { box-shadow: var(--pop); translate: 0 -1px; }
.kcard .ktop { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.kcard .kh { font-family: var(--sans); font-size: var(--f-2); font-weight: 600; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kcard .kbody { font-size: var(--f0); line-height: 1.42; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kcard .kfoot { display: flex; align-items: center; gap: 7px; margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--rule); }
.kcard .kwhen { font-family: var(--mono); font-size: var(--f-2); color: var(--rubric); }
.kcard .kwhen.dim { color: var(--ink-4); }
.kstrip { display: flex; gap: 3px; margin-top: 8px; }
.kstrip i { width: 26px; height: 20px; border-radius: 3px; background: linear-gradient(155deg, #cfd1d5, #a9acb3); flex: 0 0 auto; }
.kstrip i:nth-child(2) { background: linear-gradient(155deg, #d2c9cd, #aca2a7); }
.kstrip i:nth-child(3) { background: linear-gradient(155deg, #cad0ca, #a4aba3); }
.kadd {
  display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  padding: 9px; border-radius: var(--r); font-family: var(--sans); font-size: var(--f-1);
  color: var(--ink-4); box-shadow: inset 0 0 0 1px var(--rule-2);
}
.kadd:hover { background: var(--card); color: var(--ink-2); }

/* ═══════════════════════════════════════════════════════════════════════════
   6 · PLAN — calendar (month + week lanes)
   ═══════════════════════════════════════════════════════════════════════════ */
.mhead { display: grid; grid-template-columns: repeat(7, 1fr); padding: 9px 18px 7px; gap: 1px; }
.mhead span { font-family: var(--sans); font-size: var(--f-2); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; }

.mgrid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px;
  background: var(--rule); margin: 0 18px 18px; border-radius: var(--r-l); overflow: hidden;
  box-shadow: 0 0 0 1px var(--rule);
}
.mcell { background: var(--card); min-height: 108px; padding: 7px 7px 8px; display: flex; flex-direction: column; gap: 4px; position: relative; }
.mcell.pad { background: color-mix(in srgb, var(--ink) 2.5%, var(--card)); }
.mcell.past { background: color-mix(in srgb, var(--ink) 1.6%, var(--card)); }
.mcell.today { background: color-mix(in srgb, var(--rubric) 3.5%, var(--card)); }
.mcell:hover { background: color-mix(in srgb, var(--ink) 3.5%, var(--card)); }
.mday { display: flex; align-items: baseline; gap: 5px; }
.mday b { font-family: var(--mono); font-size: var(--f-1); color: var(--ink-3); font-weight: 500; }
.mcell.today .mday b { color: var(--rubric); font-weight: 700; }
.mday em { font-style: normal; font-family: var(--sans); font-size: var(--f-2); color: var(--rubric); letter-spacing: .06em; text-transform: uppercase; }
.mreach { margin-left: auto; font-family: var(--mono); font-size: var(--f-2); color: var(--ink-4); }
.mbar { display: block; height: 2px; border-radius: 2px; background: var(--ink-4); opacity: .4; width: calc(var(--p) * 100%); }

.mitem {
  display: flex; align-items: center; gap: 5px; padding: 3px 5px 3px 4px;
  border-radius: 4px; font-size: var(--f-1); position: relative; overflow: hidden;
  background: color-mix(in srgb, var(--ch) 8%, transparent);
  box-shadow: inset 2px 0 0 var(--ch);
  transition: background var(--t);
}
.mitem:hover { background: color-mix(in srgb, var(--ch) 16%, transparent); }
.mitem .pgl { color: var(--ch); }
.mitem em { font-style: normal; font-family: var(--mono); font-size: var(--f-2); color: color-mix(in srgb, var(--ch) 76%, var(--ink)); }
.mitem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--f-1); }

/* ── deterministic series generator ──────────────────────────────────────
   Each channel needs 90 days of followers and reach. Hand-writing eleven
   × two × ninety numbers is noise; a seeded walk shaped by the account's
   own delta gives plots that differ believably and reproduce exactly. */
function seeded(seed) { let s = seed; return () => (s = (s * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function walk(n, start, driftPct, vol, seed) {
  const r = seeded(seed), out = [];
  const step = start * (driftPct / 100) / n;
  let v = start * (1 - driftPct / 100);
  for (let i = 0; i < n; i++) { v += step + (r() - 0.5) * start * vol; out.push(Math.max(0, Math.round(v))); }
  out[n - 1] = start;
  return out;
}

}));

/* ═══════════════════════════════════════════════════════════════════════════
   CHARTS — smoothed, macOS-soft.
   Every plot is a monotone cubic through real points: no overshoot, no corner,
   no gradient standing in for a line. Grid is a hairline at 7% ink; the fill is
   a 14%→0 wash of the series' own colour.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Fritsch–Carlson monotone cubic → cubic-bezier path. Smooth without wobble. */
function smooth(pts) {
  const n = pts.length;
  if (n < 2) return "";
  const dx = [], dy = [], m = [];
  for (let i = 0; i < n - 1; i++) { dx.push(pts[i + 1][0] - pts[i][0]); dy.push(pts[i + 1][1] - pts[i][1]); m.push(dy[i] / dx[i]); }
  const t = [m[0]];
  for (let i = 1; i < n - 1; i++) {
    if (m[i - 1] * m[i] <= 0) t.push(0);
    else {
      const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1];
      t.push((w1 + w2) / (w1 / m[i - 1] + w2 / m[i]));
    }
  }
  t.push(m[n - 2]);
  let d = `M${pts[0][0].toFixed(2)} ${pts[0][1].toFixed(2)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(2)} ${(pts[i][1] + h * t[i]).toFixed(2)},`
       + `${(pts[i + 1][0] - h).toFixed(2)} ${(pts[i + 1][1] - h * t[i + 1]).toFixed(2)},`
       + `${pts[i + 1][0].toFixed(2)} ${pts[i + 1][1].toFixed(2)}`;
  }
  return d;
}

let uid = 0;
function areaChart(series, { w = 720, h = 190, fill = true, grid = 4, labels = null, pad = 10 } = {}) {
  const id = `g${uid++}`;
  const n = series[0].pts.length;
  const max = Math.max(...series.flatMap((s) => s.pts), 1);
  const px = (i) => (i / (n - 1)) * w;
  const py = (v) => h - pad - (v / max) * (h - pad * 2);
  const gl = Array.from({ length: grid + 1 }, (_, k) => {
    const y = (pad + (k / grid) * (h - pad * 2)).toFixed(1);
    return `<line class="gl" x1="0" x2="${w}" y1="${y}" y2="${y}"/>`;
  }).join("");
  const defs = series.map((s, k) => `<linearGradient id="${id}-${k}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${s.color}" stop-opacity=".20"/>
      <stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`).join("");
  const body = series.map((s, k) => {
    const pts = s.pts.map((v, i) => [px(i), py(v)]);
    const d = smooth(pts);
    const area = `${d}L${w} ${h - pad}L0 ${h - pad}Z`;
    const last = pts[pts.length - 1];
    return `${fill && k === 0 ? `<path class="cfill" d="${area}" fill="url(#${id}-${k})"/>` : ""}
      <path class="cl" d="${d}" stroke="${s.color}"/>
      <circle class="cdot" cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${s.color}"/>`;
  }).join("");
  const xl = labels ? labels.map((l, i) => `<text class="xl" x="${(i / (labels.length - 1) * w).toFixed(1)}" y="${h + 12}" text-anchor="${i === 0 ? "start" : i === labels.length - 1 ? "end" : "middle"}">${esc(l)}</text>`).join("") : "";
  return `<svg class="chart" viewBox="0 -2 ${w} ${h + (labels ? 18 : 4)}" preserveAspectRatio="none"><defs>${defs}</defs>${gl}${body}${xl}</svg>`;
}

function sparkline(pts, color, { w = 190, h = 40 } = {}) {
  const id = `s${uid++}`;
  const max = Math.max(...pts, 1), min = Math.min(...pts);
  const span = max - min || 1;
  const xy = pts.map((p, i) => [(i / (pts.length - 1)) * w, h - 3 - ((p - min) / span) * (h - 8)]);
  const d = smooth(xy);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/>
    <path class="sline" d="${d}" style="--ch:${color}"/></svg>`;
}

function barChart(vals, color, { w = 300, h = 70 } = {}) {
  const max = Math.max(...vals, 1);
  const bw = w / vals.length;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${
    vals.map((v, i) => {
      const bh = (v / max) * (h - 4);
      return `<rect x="${(i * bw + bw * .18).toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" opacity="${(0.32 + 0.55 * (v / max)).toFixed(2)}"/>`;
    }).join("")}</svg>`;
}

const cumulative = (pts) => pts.reduce((acc, v) => (acc.push((acc.at(-1) || 0) + v), acc), []);
const lastN = (arr, n) => arr.slice(-n);

/* One filter rail, used by Plan and Analytics. Platforms first, then the
   eleven handles — because "show me only Instagram" and "show me only
   @kartik.builds" are different questions and both get asked. */
function filterRail(sel, onAttr) {
  return `<div class="filters">
    <button class="fchip${sel === "all" ? " on" : ""}" ${onAttr}="all">All channels<span class="c">${ACCOUNTS.length}</span></button>
    <i class="fdiv"></i>
    ${PLATFORMS.map((p) => `<button class="fchip${sel === p.id ? " on" : ""}" ${onAttr}="${p.id}">${glyph(p.id)}${esc(p.label)}<span class="c">${p.n}</span></button>`).join("")}
    <i class="fdiv"></i>
    ${ACCOUNTS.map((a) => `<button class="fchip${sel === a.id ? " on" : ""}" ${onAttr}="${a.id}" title="${esc(a.handle)}">
      <i class="swatch" style="--ch:${a.tint}"></i>${esc(a.handle)}</button>`).join("")}
  </div>`;
}

const passes = (a, f) => f === "all" || a.id === f || a.platform === f;

function channelLegend() {
  return `<div class="legend">
    <span class="sechead" style="margin-right:4px">Channel key</span>
    ${ACCOUNTS.map((a) => `<span class="lgi"><i style="--ch:${a.tint}"></i>${esc(a.handle)}</span>`).join("")}
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN · PLAN  (kanban ⇄ calendar, one toggle top-right)
   ═══════════════════════════════════════════════════════════════════════════ */
function screenPlan() {
  const bar = `<header class="bar">
    <div class="ttl"><h1>Plan</h1><div class="sub">17 scheduled · 9 in progress · ${esc(CURRENT.name)}</div></div>
    <span class="grow"></span>
    ${state.planView === "calendar" ? `<div class="seg" style="margin-right:4px">
        <button class="${state.calView === "month" ? "on" : ""}" data-cal="month">Month</button>
        <button class="${state.calView === "week" ? "on" : ""}" data-cal="week">Channel lanes</button>
      </div>` : ""}
    <div class="seg">
      <button class="${state.planView === "kanban" ? "on" : ""}" data-plan="kanban">${G.grid} Kanban</button>
      <button class="${state.planView === "calendar" ? "on" : ""}" data-plan="calendar">${G.cal} Calendar</button>
    </div>
    <button class="btn pri">${G.plus} New</button>
  </header>`;

  const body = state.planView === "kanban" ? planKanban()
    : state.calView === "month" ? planMonth() : planWeek();

  return bar + `<div class="scroll">${filterRail(state.planFilter, "data-pf")}${body}</div>`;
}

function planKanban() {
  const cards = PLAN.filter((c) => !c.acct || passes(acct(c.acct), state.planFilter) || (state.planFilter === "all"));
  return `<div class="kan">
    ${PLAN_COLS.map((col) => {
      const items = cards.filter((c) => c.col === col.id && (state.planFilter === "all" || (c.acct && passes(acct(c.acct), state.planFilter))));
      return `<section class="kcol">
        <header class="kcolh"><b>${esc(col.label)}</b><span class="c">${items.length}</span><em>${esc(col.note)}</em></header>
        ${items.map(kanCard).join("") || `<p class="meta" style="padding:6px 4px">Nothing here.</p>`}
        <button class="kadd">${G.plus} Add</button>
      </section>`;
    }).join("")}
  </div>` + channelLegend();
}

function kanCard(c) {
  const a = c.acct ? acct(c.acct) : null;
  return `<article class="kcard" style="--ch:${a ? a.tint : "var(--rule-2)"}">
    <div class="ktop">
      ${a ? `${av(a, "sm")}<span class="kh">${esc(a.handle)}</span>` : `<span class="kh" style="color:var(--ink-4)">Unassigned</span>`}
      <span class="grow"></span>
      <span class="k">${esc(KIND[c.kind])}${c.parts ? " · " + c.parts : ""}</span>
    </div>
    <div class="kbody">${esc(c.body)}</div>
    ${c.assets ? `<div class="kstrip">${Array.from({ length: Math.min(3, c.assets) }, () => "<i></i>").join("")}</div>` : ""}
    <div class="kfoot">
      ${c.when ? `<span class="kwhen${c.col === "published" ? " dim" : ""}">${esc(c.when)}</span>`
        : `<span class="kwhen dim">${esc(c.age || "—")}</span>`}
      <span class="grow"></span>
      ${c.reach ? `<span class="meta">${num(c.reach)} reach</span>`
        : c.blocker ? `<span class="hchip warn">${esc(c.blocker)}</span>` : `<span class="hchip ok">${G.check}</span>`}
    </div>
  </article>`;
}

function planMonth() {
  const cells = [];
  const maxReach = Math.max(...Object.values(MONTH.cells).map((c) => c.reach || 0));
  for (let i = 0; i < MONTH.first; i++) cells.push(`<div class="mcell pad"></div>`);
  for (let d = 1; d <= MONTH.days; d++) {
    const c = MONTH.cells[d] || {};
    const past = d < MONTH.today;
    const sched = (c.sched || []).filter((s) => passes(acct(s.acct), state.planFilter));
    cells.push(`<button class="mcell${d === MONTH.today ? " today" : ""}${past ? " past" : ""}" data-day="${d}">
      <div class="mday"><b>${d}</b>${d === MONTH.today ? "<em>today</em>" : ""}
        ${past && c.reach ? `<span class="mreach">${num(c.reach)}</span>` : ""}</div>
      ${past && c.reach ? `<i class="mbar" style="--p:${(c.reach / maxReach).toFixed(2)}"></i>` : ""}
      ${sched.slice(0, 3).map((s) => {
        const a = acct(s.acct);
        return `<span class="mitem" style="--ch:${a.tint}"${s.failed ? ' data-status="failed"' : ""}>
          <i class="pgl">${glyph(a.platform)}</i><em>${s.t}</em><span>${esc(s.body)}</span></span>`;
      }).join("")}
      ${sched.length > 3 ? `<span class="mmore">+${sched.length - 3} more</span>` : ""}
    </button>`);
  }
  return `<div class="mhead">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map((d) => `<span>${d}</span>`).join("")}</div>
    <div class="mgrid">${cells.join("")}</div>
    <p class="anote" style="padding:0 18px">Every chip is tinted by the channel it leaves from, and carries that channel's platform mark. Past days keep the reach they earned. Click a day for the full list.</p>
    ${channelLegend()}`;
}

function planWeek() {
  const lanes = ACCOUNTS.filter((a) => passes(a, state.planFilter));
  return `<div class="lanes">
    <div class="lanehead">
      <div class="corner">${lanes.length} channels</div>
      ${WEEK.days.map((d) => `<div class="dhead${d.today ? " today" : ""}"><b>${d.label}</b><span class="meta">${d.date}</span></div>`).join("")}
    </div>
    ${lanes.map((a) => `<div class="lane" style="--ch:${a.tint}">
      <div class="lanelab">${av(a, "sm")}<span class="ah">${esc(a.handle)}</span><i class="pgl">${glyph(a.platform)}</i>
        <span class="cadmini">${a.cadence.a}/${a.cadence.t}</span></div>
      ${WEEK.days.map((d) => {
        const items = WEEK.cells[`${a.id}|${d.key}`] || [];
        return `<div class="cellw${d.today ? " today" : ""}">${items.map((it) => `
          <button class="ev"${it.failed ? ' data-status="failed"' : ""}>
            <span class="evt">${it.t}</span><span class="evb">${esc(it.body)}</span></button>`).join("")}</div>`;
      }).join("")}
    </div>`).join("")}
  </div>
  <p class="anote" style="padding:0 18px 18px">One lane per channel. An empty run of days on a lane is the thing you are meant to see.</p>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN · LIBRARY

function tileWeight(it) {
  if (it.kind === "reel") return 1.78;
  if (it.kind === "carousel") return 1.25;
  if (it.kind === "article") return 1.05;
  if (it.kind === "image") { const [w, h] = it.ratio.split("/").map(Number); return h / w + 0.1; }
  return 0.34 + Math.min(1.1, (it.body?.length ?? 0) / 150);
}

function tile(it) {
  const a = it.account ? acct(it.account) : null;
  const cap = `<div class="cap">${a ? `${av(a, "sm")}<span class="ch">${esc(a.handle)}</span>` : `<span class="ch" style="color:var(--rubric)">Idea</span>`}
    <span class="grow"></span><span class="cd">${esc(it.date)}</span></div>`;
  const media = (extra = "") => `<div class="frame" style="--ratio:${it.ratio}"><div class="ph" data-tone="${it.tone}"></div>${extra}</div>`;
  let inner = "";
  if (it.kind === "reel") inner = media(`<span class="scrim"></span><span class="playb">${G.play}</span><span class="pill">${it.duration}</span><span class="mt">${esc(it.title)}</span>`);
  else if (it.kind === "carousel") inner = `<span class="edge e2"></span><span class="edge e1"></span>` + media(`<span class="pill">${it.slides} slides</span><span class="scrim"></span><span class="mt">${esc(it.title)}</span>`);
  else if (it.kind === "image") inner = media(`<span class="scrim"></span><span class="mt">${esc(it.title)}</span>`);
  else if (it.kind === "article") inner = media() + `<div class="artbody"><h3>${esc(it.title)}</h3><span class="src">${esc(it.source)}</span></div>`;
  else if (it.kind === "note") inner = `<div class="txt note"><span class="lab">Idea</span><p>${esc(it.body)}</p></div>`;
  else inner = `<div class="txt"><span class="lab">${it.kind === "thread" ? it.parts + " parts" : "Post"}</span><p>${esc(it.body)}</p></div>`;
  return `<article class="tile">${inner}${cap}</article>`;
}

function screenLibrary() {
  const cols = 4;
  const buckets = Array.from({ length: cols }, () => ({ h: 0, items: [] }));
  for (const it of LIBRARY) {
    const b = buckets.reduce((a, c) => (c.h < a.h ? c : a));
    b.items.push(it); b.h += tileWeight(it) + 0.16;
  }
  return `<header class="bar">
      <div class="ttl"><h1>Library</h1><div class="sub">342 published · everything that has already left</div></div>
      <span class="grow"></span>
      <label class="field sm">${G.search}<input placeholder="Filter" spellcheck="false"></label>
      <div class="seg"><button class="on">Grid</button><button>By reach</button></div>
    </header>
    <div class="scroll">
      <div class="filters">${LIBRARY_FILTERS.map((f, i) => `<button class="fchip${i === 0 ? " on" : ""}">${esc(f.label)}<span class="c">${f.count}</span></button>`).join("")}</div>
      <div class="gal">${buckets.map((b) => `<div class="galcol">${b.items.map(tile).join("")}</div>`).join("")}</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   SCREEN · ANALYTICS — the wall, then one channel
   ═══════════════════════════════════════════════════════════════════════════ */
function screenAnalytics() {
  if (state.channel) return oneChannel(acct(state.channel));

  const shown = ACCOUNTS.filter((a) => passes(a, state.anFilter));
  const R = state.anRange;

  /* Totals recompute against the filter — a filtered wall with unfiltered
     totals is a lie, and the numbers are centred because they describe the
     grid below them, not the toolbar above. */
  const totFollowers = shown.reduce((s, a) => s + a.followers, 0);
  const totReach = shown.reduce((s, a) => s + lastN(SERIES[a.id].reach, R).reduce((x, y) => x + y, 0), 0);
  const totPosts = shown.reduce((s, a) => s + Math.round(lastN(SERIES[a.id].posts, R).reduce((x, y) => x + y, 0) / 7), 0);
  const totEng = (shown.reduce((s, a) => s + a.eng7, 0) / (shown.length || 1)).toFixed(1);
  const grew = shown.reduce((s, a) => s + Math.round(a.followers * a.delta / 100 * (R / 7)), 0);

  const totals = [
    { k: "Reach", v: num(totReach), d: 18.2 },
    { k: "Followers", v: num(totFollowers), d: 2.7 },
    { k: "New followers", v: "+" + grew.toLocaleString(), d: 24.1 },
    { k: "Engagement", v: totEng + "%", d: 3.4 },
    { k: "Posts out", v: String(totPosts), d: -4.5 },
  ];

  /* One series per shown channel, in that channel's own tint. */
  const series = shown.map((a) => ({
    label: a.handle, color: a.tint,
    pts: state.anView === "cumulative" ? cumulative(lastN(SERIES[a.id].reach, R)) : lastN(SERIES[a.id].reach, R),
  })).sort((x, y) => Math.max(...y.pts) - Math.max(...x.pts));

  const stacked = lastN(SERIES[ACCOUNTS[0].id].reach, R).map((_, i) =>
    shown.reduce((s, a) => s + lastN(SERIES[a.id].reach, R)[i], 0));
  const totalSeries = [{ label: "All channels", color: "#23252b", pts: state.anView === "cumulative" ? cumulative(stacked) : stacked }];
  const xlabels = R === 7 ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
    : R === 30 ? ["30d ago", "20d", "10d", "today"] : ["90d ago", "60d", "30d", "today"];

  const top = POSTS.filter((p) => passes(acct(p.acct), state.anFilter)).sort((a, b) => b.reach - a.reach).slice(0, 6);

  return `<header class="bar">
      <div class="ttl"><h1>Analytics</h1><div class="sub">${shown.length} channel${shown.length > 1 ? "s" : ""} · last ${R} days</div></div>
      <span class="grow"></span>
      <div class="seg">
        <button class="${state.anView === "overtime" ? "on" : ""}" data-anv="overtime">Over time</button>
        <button class="${state.anView === "cumulative" ? "on" : ""}" data-anv="cumulative">Cumulative</button>
      </div>
      <div class="seg">
        ${[7, 30, 90].map((r) => `<button class="${R === r ? "on" : ""}" data-anr="${r}">${r}d</button>`).join("")}
      </div>
      <button class="icobtn bare">${G.dots}</button>
    </header>
    <div class="scroll">
      ${filterRail(state.anFilter, "data-af")}

      <div class="anhead">
        <div class="totals">
          ${totals.map((t) => `<div class="tot">
            <span class="stat-k">${esc(t.k)}</span>
            <b class="stat-v">${esc(t.v)}</b>
            ${delta(t.d)}
          </div>`).join("")}
        </div>
      </div>

      <div class="anband">
        <section class="panel wide">
          <div class="sechead">${state.anView === "cumulative" ? "Cumulative reach" : "Reach per day"}
            <span class="meta">${shown.length === 1 ? esc(shown[0].handle) : "all shown channels, summed"}</span><i class="ln"></i>
            <span class="meta">${num(state.anView === "cumulative" ? totalSeries[0].pts.at(-1) : Math.max(...stacked))} peak</span></div>
          <div class="chartwrap">${areaChart(totalSeries, { w: 940, h: 168, labels: xlabels })}</div>
        </section>

        <section class="panel wide">
          <div class="sechead">Per channel <span class="meta">${state.anView === "cumulative" ? "cumulative" : "daily"} reach, one line per channel</span><i class="ln"></i></div>
          <div class="chartwrap">${areaChart(series, { w: 940, h: 176, fill: false, labels: xlabels })}</div>
          <div class="chlegend">${series.map((s) => `<span class="lgi"><i style="--ch:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>
        </section>
      </div>

      <div class="sechead" style="padding:2px 20px 10px">Channels<i class="ln"></i><span class="meta">click one for its full record</span></div>
      <div class="wall">
        ${shown.map((a) => `<article class="chcard" style="--ch:${a.tint}" data-ch="${a.id}">
          <header class="chhead">
            ${av(a)}
            <span class="chn"><b>${esc(a.handle)}</b><em>${PLAB[a.platform]}${a.project === null ? " · everywhere" : ""}</em></span>
            <i class="pgl tint" style="--ch:${a.tint}">${glyph(a.platform)}</i>
          </header>
          <div class="chnums">
            <span class="cn"><b>${num(a.followers)}</b><em>followers</em>${delta(a.delta)}</span>
            <span class="cn"><b>${num(a.reach7)}</b><em>reach 7d</em></span>
          </div>
          ${sparkline(lastN(SERIES[a.id].reach, R), a.tint)}
          <footer class="chfoot">
            <span class="cad"><i class="cadbar" style="--p:${a.cadence.t ? Math.min(1, a.cadence.a / a.cadence.t) : 0}"></i><em>${a.cadence.a}/${a.cadence.t} wk</em></span>
            <span class="grow"></span>
            ${a.health === "ok" ? `<span class="chq">${a.queued ? `<b>${a.queued}</b> queued` : "nothing queued"}</span>` : healthChip(a)}
          </footer>
        </article>`).join("")}
        <button class="chcard add">${G.plus}<span class="meta">Connect a channel</span></button>
      </div>

      <div class="anband">
        <section class="panel">
          <div class="sechead">Best time to post <span class="meta">reach by hour</span><i class="ln"></i></div>
          ${heatGrid()}
          <p class="anote">Thursday 09:00 is the peak. Six of the ten best pieces left within an hour of it.</p>
        </section>
        <section class="panel">
          <div class="sechead">Best performing <span class="meta">by reach</span><i class="ln"></i></div>
          ${top.map((p) => postRow(p, top[0].reach)).join("")}
        </section>
      </div>
    </div>`;
}

function postRow(p, max) {
  const a = acct(p.acct);
  return `<button class="postrow rankbar" style="--ch:${a.tint};--p:${(p.reach / max).toFixed(2)}">
    <span class="thumb"><span class="ph" data-tone="${p.tone}" style="position:absolute;inset:0"></span></span>
    <span class="pb">${esc(p.body)}<br><span class="meta">${esc(a.handle)} · ${esc(KIND[p.kind])} · ${esc(p.date)}</span></span>
    <span class="n">${num(p.reach)}</span><span class="n">${num(p.likes)}</span><span class="n">${p.comments}</span>
    <span class="n">${p.shares}</span><span class="n">${num(p.saves)}</span>
    <span class="n" style="color:var(--good)">${p.eng}%</span>
  </button>`;
}

function heatGrid() {
  const max = Math.max(...ANALYTICS.heat.flat());
  const rows = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  return `<div class="heat">
    <div class="heatrow head"><span></span>${ANALYTICS.hours.map((h) => `<span>${h}</span>`).join("")}</div>
    ${ANALYTICS.heat.map((r, i) => `<div class="heatrow">
      <span class="hd">${rows[i].slice(0, 1)}</span>
      ${r.map((v) => `<i class="heatcell" style="--v:${(v / max).toFixed(2)}"${v === max ? ' data-peak="1"' : ""}></i>`).join("")}
    </div>`).join("")}
  </div>`;
}

/* ── one channel ────────────────────────────────────────────────────────── */
function oneChannel(a) {
  const R = state.anRange;
  const s = SERIES[a.id];
  const posts = POSTS.filter((p) => p.acct === a.id).sort((x, y) => y.reach - x.reach);
  const fallback = POSTS.slice().sort((x, y) => y.reach - x.reach).slice(0, 4);
  const list = posts.length ? posts : fallback;
  const reachPts = lastN(s.reach, R), follPts = lastN(s.followers, R);
  const xlabels = R === 7 ? ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
    : R === 30 ? ["30d ago", "20d", "10d", "today"] : ["90d ago", "60d", "30d", "today"];
  const gained = follPts.at(-1) - follPts[0];
  const totalReach = reachPts.reduce((x, y) => x + y, 0);

  return `<header class="bar">
      <button class="icobtn bare" data-back="1">${G.left}</button>
      <div class="ttl"><h1 style="font-size:var(--f1)">${esc(a.handle)}</h1></div>
      <span class="grow"></span>
      <div class="seg">
        <button class="${state.anView === "overtime" ? "on" : ""}" data-anv="overtime">Over time</button>
        <button class="${state.anView === "cumulative" ? "on" : ""}" data-anv="cumulative">Cumulative</button>
      </div>
      <div class="seg">${[7, 30, 90].map((r) => `<button class="${R === r ? "on" : ""}" data-anr="${r}">${r}d</button>`).join("")}</div>
      <button class="btn">Open channel rules</button>
      <button class="btn pri">${G.plus} New for this channel</button>
    </header>
    <div class="scroll">
      <header class="chhero" style="--ch:${a.tint}">
        ${av(a, "lg")}
        <div class="ttl"><h1>${esc(a.handle)}</h1>
          <div class="sub">${PLAB[a.platform]} · ${a.project === null ? "every project" : esc((PROJECTS.find((p) => p.id === a.project) || {}).name)} · last out ${esc(a.last)}</div></div>
        <span class="grow"></span>
        ${healthChip(a)}
        <div class="chstats">
          <span class="cn"><b>${num(a.followers)}</b><em>followers</em>${delta(a.delta)}</span>
          <span class="cn"><b>${num(totalReach)}</b><em>reach ${R}d</em></span>
          <span class="cn"><b>${a.eng7}%</b><em>engagement</em></span>
          <span class="cn"><b>${a.best}</b><em>best hour</em></span>
          <span class="cn"><b>${a.cadence.a}/${a.cadence.t}</b><em>cadence wk</em></span>
        </div>
      </header>

      <div class="anband" style="padding-top:16px">
        <section class="panel">
          <div class="sechead">Subscribers <span class="meta">${gained >= 0 ? "+" : ""}${gained.toLocaleString()} over ${R} days</span><i class="ln"></i></div>
          ${areaChart([{ label: "Followers", color: a.tint, pts: follPts }], { w: 460, h: 150, labels: xlabels })}
        </section>
        <section class="panel">
          <div class="sechead">${state.anView === "cumulative" ? "Cumulative reach" : "Reach per day"}
            <span class="meta">${num(totalReach)} total</span><i class="ln"></i></div>
          ${areaChart([{ label: "Reach", color: a.tint, pts: state.anView === "cumulative" ? cumulative(reachPts) : reachPts }], { w: 460, h: 150, labels: xlabels })}
        </section>
        <section class="panel">
          <div class="sechead">Posts out <span class="meta">per week</span><i class="ln"></i></div>
          ${barChart(lastN(s.posts, Math.min(R, 30)), a.tint, { w: 460, h: 92 })}
          <dl class="kv" style="margin-top:14px">
            <dt>Target</dt><dd class="mono">${a.cadence.t} / week</dd>
            <dt>Actual</dt><dd class="mono">${a.cadence.a} / week</dd>
            <dt>Queued</dt><dd class="mono">${a.queued}</dd>
            <dt>Best hour</dt><dd class="mono">${esc(a.best)}</dd>
          </dl>
        </section>
      </div>

      <div class="anband">
        <section class="panel wide">
          <div class="sechead">Best performing here <span class="meta">every metric this platform reports</span><i class="ln"></i>
            <div class="seg" style="margin-left:auto">
              <button class="${state.chTab === "overview" ? "on" : ""}" data-cht="overview">Top</button>
              <button class="${state.chTab === "posts" ? "on" : ""}" data-cht="posts">All posts</button>
            </div>
          </div>
          <div class="postrow th">
            <span></span><span>Piece</span><span class="n">Reach</span><span class="n">Likes</span>
            <span class="n">Comments</span><span class="n">Shares</span><span class="n">Saves</span><span class="n">Eng.</span>
          </div>
          ${(state.chTab === "posts" ? list : list.slice(0, 5)).map((p) => postRow(p, list[0].reach)).join("")}
          ${posts.length ? "" : `<p class="anote">This channel has nothing published in range — showing the account's best across the project so the page is never empty.</p>`}
        </section>
      </div>

      <div class="anband">
        <section class="panel">
          <div class="sechead">Best time for this channel<i class="ln"></i></div>
          ${heatGrid()}
        </section>
        <section class="panel">
          <div class="sechead">Queued here <span class="meta">${a.queued} pieces</span><i class="ln"></i></div>
          ${PLAN.filter((c) => c.acct === a.id && c.col !== "published").map((c) => `
            <button class="usedrow" style="--ch:${a.tint}">
              <span class="k">${esc(KIND[c.kind])}</span>
              <span class="ub">${esc(c.body)}</span>
              <span class="meta" style="color:var(--rubric)">${esc(c.when || c.age || "")}</span></button>`).join("")
            || `<p class="anote">Nothing queued for this channel. That is the number that matters on this page.</p>`}
          <div class="sechead" style="margin-top:14px">Channel rules<i class="ln"></i></div>
          <button class="usedrow"><i class="obox" style="background:var(--ink);color:var(--paper)">${G.check}</i><span class="ub">Never two reels in a row</span></button>
          <button class="usedrow"><i class="obox" style="background:var(--ink);color:var(--paper)">${G.check}</i><span class="ub">Alt text required</span></button>
          <button class="usedrow"><i class="obox"></i><span class="ub">Mirror to @kartik.builds</span></button>
        </section>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   DAY DRAWER
   ═══════════════════════════════════════════════════════════════════════════ */
function renderDrawer() {
  const d = state.day;
  document.body.dataset.drawer = d ? "on" : "off";
  if (!d) return;
  const c = MONTH.cells[d] || {};
  const sched = c.sched || [];
  $("#drawer").innerHTML = `
    <header class="bar" style="padding:0 16px">
      <div class="ttl"><h1 style="font-size:var(--f1)">${d} July</h1>
        <div class="sub">${sched.length} scheduled${c.reach ? ` · ${num(c.reach)} reach earned` : ""}</div></div>
      <span class="grow"></span>
      <button class="icobtn bare" data-close="1" aria-label="Close">${G.close}</button>
    </header>
    <div class="drawerbody">
      ${sched.length ? sched.map((s) => { const a = acct(s.acct); return `
        <div class="drow" style="--ch:${a.tint}">
          <span class="dtime">${s.t}</span>
          <span style="flex:1;min-width:0">
            <span style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              ${av(a, "sm")}<span class="sans" style="font-size:var(--f-2);font-weight:700">${esc(a.handle)}</span>
              <span class="k">${esc(KIND[s.kind])}</span></span>
            <span style="font-size:var(--f0);line-height:1.4">${esc(s.body)}</span>
            ${s.failed ? `<span class="hchip bad" style="margin-top:6px">${G.warn} Failed — token expired</span>` : ""}
          </span>
        </div>`; }).join("")
        : `<p class="empty">Nothing scheduled. Drag something here from the Ready column.</p>`}
      <button class="kadd" style="margin-top:6px">${G.plus} Schedule something on this day</button>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER + EVENTS
   ═══════════════════════════════════════════════════════════════════════════ */
function render() {
  renderSide();
  const screens = { plan: screenPlan, library: screenLibrary, articles: screenArticles, assets: screenAssets, analytics: screenAnalytics };
  $("#main").innerHTML = (screens[state.route] || screenPlan)();
  renderDrawer();
}

document.addEventListener("click", (e) => {
  const hit = (sel) => e.target.closest(sel);
  let el;
  if ((el = hit("[data-go]")))    return go({ route: el.dataset.go, channel: null, article: null, day: null });
  if ((el = hit("[data-plan]")))  return go({ planView: el.dataset.plan });
  if ((el = hit("[data-cal]")))   return go({ calView: el.dataset.cal });
  if ((el = hit("[data-pf]")))    return go({ planFilter: el.dataset.pf });
  if ((el = hit("[data-af]")))    return go({ anFilter: el.dataset.af });
  if ((el = hit("[data-anv]")))   return go({ anView: el.dataset.anv });
  if ((el = hit("[data-anr]")))   return go({ anRange: +el.dataset.anr });
  if ((el = hit("[data-cht]")))   return go({ chTab: el.dataset.cht });
  if ((el = hit("[data-art]")))   return go({ route: "articles", article: el.dataset.art });
  if ((el = hit("[data-ch]")))    return go({ route: "analytics", channel: el.dataset.ch, chTab: "overview" });
  if ((el = hit("[data-day]")))   return go({ day: +el.dataset.day });
  if (hit("[data-close]") || hit("#scrim")) return go({ day: null });
  if (hit("[data-back]"))         return go({ channel: null, article: null });
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") return go({ day: null, channel: null, article: null });
  if (e.target.tagName === "INPUT") return;
  const map = { 1: "plan", 2: "library", 3: "articles", 4: "assets", 5: "analytics" };
  if (map[e.key]) go({ route: map[e.key], channel: null, article: null, day: null });
});

render();
</script>
</body>
</html>
